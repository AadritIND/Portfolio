<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AADRIT — Full-Stack Developer, Cybersecurity & AI/ML Explorer</title>
  <meta name="description"
    content="Official portfolio of Aadrit (github.com/Aadrit1234). Full-stack developer, cybersecurity & ethical hacking enthusiast, and AI/ML explorer. Specializing in real-time web apps, self-hosted tooling, and AI-powered products." />

  <!-- Wild Stylized Display Fonts via cdnfonts.com — each font has visually altered letterforms -->
  <style>
    /* Azonix: Ultra-geometric sci-fi — completely remapped letterforms */
    @font-face {
      font-family: 'Azonix';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('Azonix'), url('https://fonts.cdnfonts.com/s/16327/Azonix.woff') format('woff');
    }

    /* Conthrax: Techno-condensed military display font */
    @font-face {
      font-family: 'Conthrax';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: local('Conthrax'), url('https://fonts.cdnfonts.com/s/17842/conthrax-sb.woff') format('woff');
    }

    /* Nasalization: Space-age rounded techno */
    @font-face {
      font-family: 'Nasalization';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('Nasalization Rg'), url('https://fonts.cdnfonts.com/s/6224/nasalization rg.woff') format('woff');
    }

    /* Audiowide: Retro-tech readable body display */
    @font-face {
      font-family: 'Audiowide';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('Audiowide'), url('https://fonts.cdnfonts.com/s/15406/Audiowide-Regular.woff') format('woff');
    }

    /* Orbitron: The sci-fi classic — perfect for labels & UI */
    @font-face {
      font-family: 'Orbitron';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('Orbitron'), url('https://fonts.cdnfonts.com/s/334/orbitron-light.woff') format('woff');
    }

    @font-face {
      font-family: 'Orbitron';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: local('Orbitron'), url('https://fonts.cdnfonts.com/s/334/orbitron-bold.woff') format('woff');
    }

    @font-face {
      font-family: 'Orbitron';
      font-style: normal;
      font-weight: 900;
      font-display: swap;
      src: local('Orbitron'), url('https://fonts.cdnfonts.com/s/334/orbitron-black.woff') format('woff');
    }

    /* Blanka: Wild hollow/inline letterforms — ultra-decorative */
    @font-face {
      font-family: 'Blanka';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('Blanka'), url('https://fonts.cdnfonts.com/s/18915/Blanka-Regular.woff') format('woff');
    }
  </style>

  <!-- JetBrains Mono for terminal/code only -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap"
    rel="stylesheet">
</head>

<body class="bg-[#F8F9FA] text-[#0D0E12] antialiased selection:bg-[#0052FF] selection:text-white overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
